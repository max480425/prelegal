[project]
name = "prelegal-backend"
version = "1.0.0"
description = "Prelegal API - generate legal documents from templates"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-multipart==0.0.6",
    "reportlab==4.0.7",
    "markdown==3.5.1",
    "python-dateutil==2.8.2",
    "bcrypt==5.0.0",
    "PyJWT==2.11.0",
    "email-validator==2.3.0",
    # 1.83.0 is the newest litellm that accepts our pinned httpx==0.27.2 and
    # pydantic==2.5.0 (1.84.0+ require httpx>=0.28 and pydantic>=2.10).
    # litellm declares openai>=2.8.0 with no upper bound; openai 3.x switched
    # to httpx2, so cap it below 3 until the stack is upgraded together.
    "litellm==1.83.0",
    "openai>=2.8.0,<3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    # starlette 0.27 (fastapi 0.104) TestClient passes `app=` to httpx.Client,
    # which httpx 0.28 removed — keep 0.27.x until FastAPI is upgraded.
    "httpx==0.27.2",
]

[tool.uv]
# The backend is a plain application (imports `backend.*` from the repo root),
# not an installable package.
package = false
